<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" type="image/webp" href="./favicon.webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
    <!-- app:head -->
  </head>
  <body>
    <!-- app:gtm-noscript -->
    <a class="skip" href="#conteudo">Pular para o conteúdo</a>
    <header class="nav">
      <div class="container nav__inner">
        <!-- PENDENTE: logo completo (símbolo + nome) quando a RCO enviar o arquivo. -->
        <a class="nav__brand" href="#topo" aria-label="CRM RCO, início"><img src="./rco-simbolo.webp" alt="" width="32" height="31" /><span>CRM RCO</span></a>
        <!-- app:nav -->
      </div>
    </header>

    <main id="conteudo">
      <!-- PENDENTE: copy oficial de toda a página. -->
      <section class="hero" id="topo">
        <div class="container hero__inner">
        <!-- app:hero -->
        </div>
      </section>

      <section class="section" id="recursos" aria-labelledby="recursos-title">
        <div class="container">
          <h2 id="recursos-title" class="big-title"><!-- app:pillars-title --></h2>
          <ul class="pillars" role="list">
          <!-- app:pillars -->
          </ul>
        </div>
      </section>

      <!-- app:tour -->

      <!-- app:dives -->

      <section class="section section--soft" id="como-funciona" aria-labelledby="como-title">
        <div class="container">
          <p class="eyebrow">Como funciona</p>
          <h2 id="como-title" class="section__title">Da criação da conta ao funil rodando</h2>
          <ol class="steps">
          <!-- app:steps -->
          </ol>
        </div>
      </section>

      <section class="section" id="planos" aria-labelledby="planos-title">
        <div class="container">
          <p class="eyebrow">Planos</p>
          <h2 id="planos-title" class="section__title">Planos e preços</h2>
          <!-- app:plans -->
        </div>
      </section>

      <section class="section section--soft" id="seguranca" aria-labelledby="seg-title">
        <div class="container">
          <p class="eyebrow">Segurança e controle</p>
          <h2 id="seg-title" class="big-title">Cada pessoa vê e faz só o que deve</h2>
          <ul class="trust" role="list">
          <!-- app:trust -->
          </ul>
        </div>
      </section>

      <!-- app:testimonials -->

      <section class="section" id="duvidas" aria-labelledby="faq-title">
        <div class="container container--narrow">
          <h2 id="faq-title" class="section__title section__title--center">Perguntas frequentes</h2>
          <div class="faq">
          <!-- app:faq -->
          </div>
        </div>
      </section>

      <section class="closing" aria-labelledby="closing-title">
        <div class="container closing__inner">
          <h2 id="closing-title" class="closing__title"><!-- app:closing-title --></h2>
          <!-- app:closing -->
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="container footer__inner">
        <span>© RCO</span>
        <!-- app:footer-login -->
      </div>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
